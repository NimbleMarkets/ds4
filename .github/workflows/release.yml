name: Release

# Build the libds4 FFI shared library for each supported platform and attach
# the results to a GitHub Release. Triggered by pushing a version tag, e.g.:
#
#   git tag v1.2.3 && git push nm v1.2.3
#
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read   # build jobs only read the repo; the release job elevates

env:
  # The Makefile defaults NATIVE_CPU_FLAG to -march=native / -mcpu=native,
  # which bakes in the *CI runner's* CPU. A binary tuned that way can crash
  # with SIGILL on an older/different CPU, so release artifacts use a portable
  # baseline instead. Raise these if you only target newer hardware.
  CPU_FLAG_X86: -march=x86-64-v3       # AVX2-era x86_64 baseline
  CPU_FLAG_ARM64_MACOS: -mcpu=apple-m1 # Apple Silicon baseline
  CPU_FLAG_ARM64_LINUX: -mcpu=neoverse-v2  # Grace / GB10 (DGX Spark)
  # CUDA toolkit apt package suffix from NVIDIA's ubuntu2404 repo. 13-0 is
  # required for GB10 (sm_121); it also builds the x86_64 artifact fine.
  CUDA_PKG_VERSION: 13-0
  # Virtual GPU arch for the x86_64 CUDA build. nvcc emits forward-compatible
  # PTX that JIT-compiles on any GPU >= this. compute_75 (Turing) is the floor
  # that has the __dp4a intrinsic ds4_cuda.cu needs.
  # The arm64/GB10 build deliberately omits -arch (the upstream `cuda-spark`
  # path, "the fastest path on GB10") and relies on CUDA 13's modern default.
  CUDA_ARCH: compute_75

jobs:
  macos-metal-arm64:
    name: macOS Metal (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Build libds4 (Metal)
        run: make shared NATIVE_CPU_FLAG="$CPU_FLAG_ARM64_MACOS"

      - name: Code Sign libds4.dylib
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: .github/scripts/macos-sign.sh libds4.dylib

      - name: Notarize libds4.dylib
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: .github/scripts/macos-notarize.sh libds4.dylib

      - name: Package
        run: |
          PKG="libds4-${GITHUB_REF_NAME}-macos-arm64-metal"
          mkdir -p "$PKG"
          cp libds4.dylib ds4.h LICENSE "$PKG/"
          tar -czf "$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: libds4-macos-arm64-metal
          path: libds4-*-macos-arm64-metal.tar.gz

  linux-cuda-x86_64:
    name: Linux CUDA (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install CUDA toolkit
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "cuda-toolkit-${CUDA_PKG_VERSION}"

      - name: Build libds4 (CUDA)
        run: |
          export PATH="/usr/local/cuda/bin:$PATH"
          make shared NATIVE_CPU_FLAG="$CPU_FLAG_X86" CUDA_ARCH="$CUDA_ARCH"

      - name: Package
        run: |
          PKG="libds4-${GITHUB_REF_NAME}-linux-x86_64-cuda"
          mkdir -p "$PKG"
          cp libds4.so ds4.h LICENSE "$PKG/"
          tar -czf "$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: libds4-linux-x86_64-cuda
          path: libds4-*-linux-x86_64-cuda.tar.gz

  linux-cuda-arm64:
    name: Linux CUDA (arm64/sbsa)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install CUDA toolkit
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "cuda-toolkit-${CUDA_PKG_VERSION}"

      - name: Build libds4 (CUDA)
        run: |
          export PATH="/usr/local/cuda/bin:$PATH"
          # GB10: omit -arch (upstream `cuda-spark` path), CUDA 13's default suffices.
          make shared NATIVE_CPU_FLAG="$CPU_FLAG_ARM64_LINUX"

      - name: Package
        run: |
          PKG="libds4-${GITHUB_REF_NAME}-linux-arm64-cuda"
          mkdir -p "$PKG"
          cp libds4.so ds4.h LICENSE "$PKG/"
          tar -czf "$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: libds4-linux-arm64-cuda
          path: libds4-*-linux-arm64-cuda.tar.gz

  release:
    name: Publish GitHub Release
    needs: [macos-metal-arm64, linux-cuda-x86_64, linux-cuda-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the Release and upload assets
      id-token: write       # OIDC identity for Sigstore signing
      attestations: write   # record build provenance attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS

      # Sign Sigstore build-provenance attestations for each shared library
      # archive. Consumers verify with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/libds4-*.tar.gz

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
